services:
  - type: web
    name: scholars-hub-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_HOST
        sync: false
