; ============================================================================
; Scholars Hub - Facebook HHVM (HipHop Virtual Machine) Configuration
; Optimized for Proxygen C++ Web Server Engine & Extreme JIT Throughput
; ============================================================================

; Server Mode Configuration
hhvm.server.type = proxygen
hhvm.server.port = 5000
hhvm.server.default_document = index.hack
hhvm.server.error_document500 = /500.html
hhvm.server.thread_count = 64
hhvm.server.connection_limit = 2048
hhvm.server.request_timeout_seconds = 30

; JIT (Just-In-Time) Compiler & Profile-Guided Optimization (PGO)
hhvm.jit = true
hhvm.jit_pgo = true
hhvm.jit_pgo_threshold = 2
hhvm.jit_a_size = 268435456
hhvm.jit_a_cold_size = 134217728

; Memory Management & Resources
hhvm.resource_limit.max_memory = 2048M
hhvm.resource_limit.max_post_size = 10M

; Logging & Diagnostics
hhvm.log.level = Warning
hhvm.log.use_syslog = false
hhvm.log.header = true

; Strict Hack Typechecker Enforcement
hhvm.hack.lang.look_for_typechecker = false
hhvm.force_hh = true
